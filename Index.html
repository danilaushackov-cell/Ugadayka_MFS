  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: #181B22;
      color: #F4F6FA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Тонкий дуотоновый градиент с референса — строго как лёгкий атмосферный свет сверху */
    .hero-ambient {
      background:
        radial-gradient(ellipse 68% 46% at 50% 0%, rgba(235, 94, 108, 0.22) 0%, rgba(72, 215, 176, 0.09) 48%, transparent 80%);
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.015) 25%, rgba(255,255,255,0.045) 50%, rgba(255,255,255,0.015) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite linear;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Состояния полей проверки */
    .field-group.ok input {
      border-color: rgba(72, 215, 176, 0.7) !important;
      background-color: rgba(72, 215, 176, 0.06) !important;
      color: #E6FBF5;
    }
    .field-group.ok .mark {
      color: #48D7B0;
    }

    .field-group.warn input {
      border-color: rgba(245, 184, 73, 0.7) !important;
      background-color: rgba(245, 184, 73, 0.07) !important;
      color: #FEF6E7;
    }
    .field-group.warn .mark {
      color: #F5B849;
    }

    .field-group.bad input {
      border-color: rgba(235, 94, 108, 0.7) !important;
      background-color: rgba(235, 94, 108, 0.07) !important;
      color: #FDECEF;
    }
    .field-group.bad .mark {
      color: #EB5E6C;
    }

    details summary::-webkit-details-marker {
      display: none;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #2E3442;
      border-radius: 9999px;
    }
  </style>

  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k) || "";

    } catch (e) {}
    return "";
  }

  /* ============================================================================
   * 3. НЕЧЁТКОЕ СРАВНЕНИЕ ОТВЕТОВ (ЛЕВЕНШТЕЙН, СИНОНИМЫ, ДЕСЯТИЛЕТИЯ)
   * ============================================================================ */
  function norm(s) {
    return String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s]/g, "").replace(/\s+/g, " ").trim();
  }
  function lev(a, b) {
    var m = a.length, n = b.length, p = [], i, j, c;
    if (!m) return n;
    if (!n) return m;
    for (j = 0; j <= n; j++) p[j] = j;
    for (i = 1; i <= m; i++) {
      var prev = p[0];
      p[0] = i;
      for (j = 1; j <= n; j++) {
        var t = p[j];
        c = a[i - 1] === b[j - 1] ? 0 : 1;
        p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + c);
        prev = t;
      }
    }
    return p[n];
  }
  function near(inp, v) {
    var a = norm(inp), b = norm(v);
    if (!a || !b) return false;
    var tol = b.length <= 4 ? 0 : b.length <= 8 ? 1 : b.length <= 14 ? 2 : 3;
    return lev(a, b) <= tol;
  }
  function anyNear(inp, list) {
    return list.some(function(v) { return near(inp, v); });
  }
  function names(s) {
    return s.split(/,|\s+и\s+/).map(function(x) { return x.trim(); }).filter(Boolean);
  }
  function personFullVariants(n) {
    var out = [n];
    var p = n.split(/\s+/);
    if (p.length > 2) {
      out.push(p[0] + " " + p[p.length - 1]);
      out.push(p.slice(-2).join(" "));
    }
    (ALIAS[n] || []).forEach(function(x) {
      if (x.indexOf(" ") !== -1) out.push(x);
    });
    return out;
  }
  function personShortVariants(n) {
    var out = [];
    var p = n.split(/\s+/);
    if (p.length > 1) {
      out.push(p[p.length - 1]);
    }
    (ALIAS[n] || []).forEach(function(x) {
      if (x.indexOf(" ") === -1) out.push(x);
    });
    return out;
  }
  function checkPerson(inp, list) {
    var matchedFull = null;
    for (var i = 0; i < list.length; i++) {
      if (anyNear(inp, personFullVariants(list[i]))) {
        matchedFull = list[i];
        break;
      }
    }
    if (matchedFull) {
      return { good: true, warn: false, matched: matchedFull };
    }
    var matchedShort = null;
    for (var j = 0; j < list.length; j++) {
      if (anyNear(inp, personShortVariants(list[j]))) {
        matchedShort = list[j];
        break;
      }
    }
    if (matchedShort) {
      return { good: true, warn: true, matched: matchedShort };
    }
    return { good: false, warn: false, matched: null };
  }
  function titleVariants(t) {
    var base = t.replace(/\s*\([^)]*\)/g, "");
    var v = [t, base, base.split(",")[0]].concat(ALIAS[t] || []);
    base.split(/\s+или\s+/i).forEach(function(x) { v.push(x); });
    return v;
  }
  function countryVariants(c) {
    var v = [c];
    names(c).forEach(function(x) { v.push(x); });
    (CA[norm(c)] || []).forEach(function(x) { v.push(x); });
    return v;
  }
  function checkYear(inp, year) {
    var y = (String(inp).match(/\d{4}/) || [""])[0];
    if (!y) return { good: false, exact: false, decade: false };
    var exact = y === String(year);
    var decade = Math.floor(+y / 10) === Math.floor(+year / 10);
    return { good: decade, exact: exact, decade: decade };
  }
  function check(f, v) {
    var dirRes = checkPerson(v.dir, f.dir);
    var yearRes = checkYear(v.year, f.year);
    var r = {
      title: { good: anyNear(v.title, titleVariants(f.title)) },
      dir: dirRes,
      year: yearRes
    };
    if (f.dop.length) r.dop = checkPerson(v.dop, f.dop);
    if (f.country) r.country = { good: anyNear(v.country, countryVariants(f.country)) };
    return r;
  }
  function fieldsFor(f) {
    var a = [
      ["title", "Название фильма"],
      ["dir", "Режиссёр"]
    ];
    if (f.dop.length) a.push(["dop", "Оператор"]);
    if (f.country) a.push(["country", "Страна"]);
    a.push(["year", "Год выхода"]);
    return a;
  }

  /* ============================================================================
   * 4. РАЗБОР ТАБЛИЦЫ И ЗАГРУЗКА ДАННЫХ (JSONP + GOOGLE DRIVE)
   * ============================================================================ */
  var FOLDER = /drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/g;
  var FILE = /drive\.google\.com\/(?:file\/d\/|(?:open|uc)\?(?:[^\s"]*&)?id=)([\w-]+)/g;
  var HDR = /\(([^()]*\d{4}[^()]*реж[^()]*)\)/gi;
  function makeFilm(pre, inner) {
    var y = inner.match(/\d{4}/);
    if (!y) return null;
    var rest = inner.slice(inner.indexOf(y[0]) + 4), ri = rest.search(/реж/i);
    if (ri < 0) return null;
    var country = rest.slice(0, ri).replace(/^\s*г\.?(?=[\s\-–—,.]|$)/, "").replace(/^[\s\-–—,.]+|[\s\-–—,.]+$/g, "");
    var rr = rest.slice(ri).replace(/^реж\.?/i, ""), oi = rr.search(/опер/i);
    var dirS = oi < 0 ? rr : rr.slice(0, oi), dopS = oi < 0 ? "" : rr.slice(oi).replace(/^опер\.?/i, "");
    var title = pre.replace(/^[\s"«“]+|[\s"»”,]+$/g, "").replace("докторо ", "доктора ");
    var dir = names(dirS);
    if (!title || !dir.length) return null;
    return { title: title, year: y[0], country: country, dir: dir, dop: names(dopS), folders: [], files: [], imgs: [] };
  }
  function parseRows(rows) {
    var out = [], cur = null;
    rows.forEach(function(cell) {
      String(cell).split(/\n/).forEach(function(line) {
        var m, last = null;
        HDR.lastIndex = 0;
        while ((m = HDR.exec(line))) last = m;
        if (last) {
          cur = makeFilm(line.slice(0, last.index), last[1]);
          if (cur) out.push(cur);
          return;
        }
        if (!cur) return;
        var u;
        FOLDER.lastIndex = 0;
        while ((u = FOLDER.exec(line))) cur.folders.push(u[1]);
        FILE.lastIndex = 0;
        while ((u = FILE.exec(line))) cur.files.push(u[1]);
      });
    });
    return out;
  }

  function parseUrl(u) {
    return { id: (u.match(/\/d\/([\w-]+)/) || [])[1], gid: (u.match(/[#&?]gid=(\d+)/) || [])[1] };
  }
  function loadSheet(id, gid) {
    return new Promise(function(res, rej) {
      var cb = "__sheet" + Date.now(), s = document.createElement("script"), t;
      function done() {
        clearTimeout(t);
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      t = setTimeout(function() { done(); rej(new Error("timeout")); }, 12000);
      window[cb] = function(r) { done(); res(r); };
      s.onerror = function() { done(); rej(new Error("load")); };
      s.onload = function() { setTimeout(function() { if (window[cb]) { done(); rej(new Error("format")); } }, 300); };
      s.src = "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=" + encodeURIComponent("out:json;responseHandler:" + cb) + "&headers=0" + (gid ? "&gid=" + gid : "") + "&_=" + Date.now();
      document.head.appendChild(s);
    });
  }
  function sheetCells(r) {
    var cells = [];
    if (!r || !r.table) return cells;
    (r.table.cols || []).forEach(function(c) { if (c && c.label) cells.push(c.label); });
    (r.table.rows || []).forEach(function(row) { (row.c || []).forEach(function(c) { if (c && c.v != null) cells.push(String(c.v)); }); });
    return cells;
  }

  function jsonp(url, timeout) {
    return new Promise(function(res, rej) {
      var cb = "__j" + Date.now() + Math.floor(Math.random() * 1e6), s = document.createElement("script"), t;
      function done() {
        clearTimeout(t);
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      t = setTimeout(function() { done(); rej(new Error("timeout")); }, timeout || 15000);
      window[cb] = function(r) { done(); res(r); };
      s.onerror = function() { done(); rej(new Error("load")); };
      s.src = url + (url.indexOf("?") < 0 ? "?" : "&") + "callback=" + cb;
      document.head.appendChild(s);
    });
  }
  function folderImages(fid, key, script) {
    var known = KNOWN[fid] || [];
    var viaScript = script ? jsonp(script + (script.indexOf("?") < 0 ? "?" : "&") + "folder=" + encodeURIComponent(fid))
      .then(function(r) { return (r && r.files) || []; }).catch(function() { return []; }) : Promise.resolve([]);
    return viaScript.then(function(a) {
      if (a.length) return a;
      if (!key) return known;
      var q = "'" + fid + "' in parents and mimeType contains 'image/' and trashed=false";
      return fetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=" + encodeURIComponent("files(id)") + "&pageSize=200&key=" + encodeURIComponent(key))
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(j) { var b = (j.files || []).map(function(x) { return x.id; }); return b.length ? b : known; })
        .catch(function() { return known; });
    });
  }
  function resolveFilm(f, key, script) {
    return Promise.all(f.folders.map(function(id) { return folderImages(id, key, script); })).then(function(lists) {
      var seen = {};
      f.imgs = [].concat.apply(f.files.slice(), lists).filter(function(x) { if (seen[x]) return false; seen[x] = 1; return true; });
      return f;
    });
  }
  function imgSrc(id, alt) {
    return alt ? "https://lh3.googleusercontent.com/d/" + id + "=w1600" : "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
  }

  /* ============================================================================
   * 5. СОСТОЯНИЕ ИГРЫ И ВЫБОРКА 10 СЛУЧАЙНЫХ ФИЛЬМОВ
   * ============================================================================ */
  var root = document.getElementById("game"),
      appHeader = document.getElementById("app-header"),
      films = [],
      skipped = [],
      source = "",
      lastRoundTitles = [],
      order = [],
      idx = 0,
      log = [];

  function setHud(visible) {
    if (!appHeader) return;
    if (visible) {
      appHeader.classList.remove("hidden");
      appHeader.classList.add("flex");
    } else {
      appHeader.classList.add("hidden");
      appHeader.classList.remove("flex");
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function pickTenFilms(pool) {
    var count = Math.min(ROUND_SIZE, pool.length);
    if (pool.length <= count) return shuffle(pool);

    var fresh = pool.filter(function(f) { return lastRoundTitles.indexOf(f.title) === -1; });
    var used = pool.filter(function(f) { return lastRoundTitles.indexOf(f.title) !== -1; });

    var selected = shuffle(fresh).slice(0, count);
    if (selected.length < count) {
      selected = selected.concat(shuffle(used).slice(0, count - selected.length));
    }
    return shuffle(selected);
  }

  function plural(n) {
    var a = n % 100, b = n % 10;
    return (a > 10 && a < 15) ? "фильмов" : b === 1 ? "фильм" : (b > 1 && b < 5) ? "фильма" : "фильмов";
  }

  function refresh() {
    setHud(false);
    root.innerHTML =
      '<div class="flex-1 flex flex-col items-center justify-center gap-3 text-center py-12" role="status">' +
        '<div class="w-7 h-7 rounded-full border-2 border-k-elevated border-t-k-mint animate-spin"></div>' +
        '<p class="text-xs text-k-muted">Загрузка коллекции…</p>' +
      '</div>';

    var url = store("sheetUrl") || DEFAULT_URL,
        key = store("apiKey"),
        script = store("scriptUrl") || DEFAULT_SCRIPT,
        p = parseUrl(url);
    var get = p.id ? loadSheet(p.id, p.gid).then(function(r) { source = "table"; return parseRows(sheetCells(r)); })
                   : Promise.reject(new Error("url"));
    get.catch(function() { source = "builtin"; return parseRows(BUILTIN); })
      .then(function(list) { return Promise.all(list.map(function(f) { return resolveFilm(f, key, script); })); })
      .then(function(list) {
        var uniqueMap = {};
        films = list.filter(function(f) {
          if (!f.imgs.length || uniqueMap[f.title]) return false;
          uniqueMap[f.title] = true;
          return true;
        });
        skipped = list.filter(function(f) { return !f.imgs.length; });
        menu();
      });
  }

  /* ============================================================================
   * 6. СТАРТОВЫЙ ЭКРАН (МИНИМАЛИЗМ В СТИЛЕ KONTAKT: ЧИСТЫЙ КОНТЕЙНЕР, ВОЗДУХ, МЯТНЫЙ АКЦЕНТ)

              '</div>' +

              '</div>' +

              '</div>' +

    document.getElementById("s-url").value = store("sheetUrl") || DEFAULT_URL;
    document.getElementById("s-key").value = store("apiKey");
    document.getElementById("s-script").value = store("scriptUrl") || DEFAULT_SCRIPT;
    document.getElementById("start").addEventListener("click", function() {
      start();
    });
    document.getElementById("reload").addEventListener("click", function() {
      refresh();
    });
    document.getElementById("save").addEventListener("click", function() {
      store("sheetUrl", document.getElementById("s-url").value.trim());
      store("apiKey", document.getElementById("s-key").value.trim());

  /* ============================================================================
   * 7. ИГРОВОЙ ЭКРАН (СКРИНШОТ ИЗ БАЗЫ + ЧИСТЫЕ ПОЛЯ ОТВЕТА)
   * ============================================================================ */
  function start() {
    order = pickTenFilms(films);
    lastRoundTitles = order.map(function(f) { return f.title; });
    idx = 0;
    log = [];
    show();
  }

  function show() {
    if (idx >= order.length) return finish();
    setHud(true);
    var f = order[idx];
    f.fields = fieldsFor(f);
    f.done = false;
    f.cur = f.imgs[Math.floor(Math.random() * f.imgs.length)];
    f.seen = [f.cur];
    f.swaps = 0;

    var pct = Math.round((idx / order.length) * 100);
    var fieldsHtml = f.fields.map(function(x) {
      return '<div class="field-group" id="f-' + x[0] + '">' +
        '<label for="i-' + x[0] + '" class="block text-[11px] font-medium text-k-muted mb-1">' + x[1] + '</label>' +
        '<input id="i-' + x[0] + '" autocomplete="off" ' + (x[0] === "year" ? 'inputmode="numeric" ' : '') +
        'class="w-full px-3.5 py-2.5 rounded-xl bg-k-bg border border-k-border focus:border-k-mint focus:outline-none text-sm text-white transition-colors">' +

          '<div id="shot" class="relative w-full aspect-[16/10] lg:aspect-auto lg:flex-1 lg:min-h-[430px] lg:max-h-[calc(100dvh-185px)] rounded-3xl bg-[#111318] border border-k-border overflow-hidden flex items-center justify-center">' +
          '</div>' +
          '<button type="button" id="swap" class="self-center mt-3 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-k-surface hover:bg-k-elevated border border-k-border text-k-muted hover:text-white text-xs transition-colors disabled:opacity-40 disabled:cursor-default disabled:hover:bg-k-surface disabled:hover:text-k-muted"></button>' +
        '</div>' +

        /* Панель ответа */
        '<div class="lg:col-span-5 xl:col-span-4 rounded-3xl bg-k-surface border border-k-border p-5 sm:p-6 flex flex-col justify-between">' +
          '<div>' +
            '<div class="flex items-center justify-between text-xs mb-2.5">' +
              '<span class="text-k-muted">' +

                'Ответ' +
              '</span>' +
            '</div>' +

            '<div class="w-full h-1 bg-k-bg rounded-full overflow-hidden mb-5">' +

            '</div>' +

            '<form id="form" novalidate class="space-y-2">' +
              fieldsHtml +
              '<div class="pt-2.5">' +
                '<button type="submit" id="go" class="w-full py-3.5 px-6 rounded-xl bg-k-mint hover:bg-k-mintHover text-[#13221E] font-bold text-sm tracking-wider uppercase transition-all active:scale-[0.99]">' +
                  'Проверить' +

          '<div class="mt-4">' +

    window.scrollTo({ top: 0, behavior: "smooth" });
    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();
      submit(f);
    });
  }

  /* ---- Кадр: загрузка и замена (до MAX_SWAPS раз на фильм) ---- */
  var MAX_SWAPS = 2;

  function loadFrame(f) {
    var shot = document.getElementById("shot");
    if (!shot) return;
    shot.innerHTML =
      '<div id="shot-skeleton" class="absolute inset-0 skeleton-shimmer flex items-center justify-center">' +
        '<span class="text-[11px] text-k-muted tracking-widest uppercase">Загрузка кадра</span>' +
      '</div>' +
      '<img id="frameimg" src="' + imgSrc(f.cur, 0) + '" alt="Кадр из фильма" referrerpolicy="no-referrer" ' +
        'class="relative z-10 w-full h-full object-contain opacity-0 transition-opacity duration-300">';

    var im = document.getElementById("frameimg"),
        skel = document.getElementById("shot-skeleton"),
        tried = 0;

    im.onload = function() {
      im.classList.remove("opacity-0");
      if (skel) skel.style.display = "none";
    };

    im.onerror = function() {
      if (!tried) {
        tried = 1;
        im.src = imgSrc(f.cur, 1);
      } else {
        shot.innerHTML =
          '<div class="p-6 text-center text-xs text-k-muted max-w-xs">' +
            'Не удалось загрузить кадр. Проверьте интернет или доступ к Google Drive.' +
          '</div>';
      }
    };
  }

  function swapsLeft(f) {
    var unseen = f.imgs.length - f.seen.length;
    return Math.max(0, Math.min(MAX_SWAPS - f.swaps, unseen));
  }

  function updateSwapBtn(f) {
    var b = document.getElementById("swap");
    if (!b) return;
    if (f.imgs.length < 2) {
      b.style.display = "none";
      return;
    }
    var left = swapsLeft(f);
    b.disabled = left === 0;
    b.textContent = left > 0
      ? "↻ Другой кадр · осталось " + left
      : "Замен больше нет";
  }

  function swapFrame(f) {
    if (f.done || swapsLeft(f) === 0) return;
    var pool = f.imgs.filter(function(id) { return f.seen.indexOf(id) === -1; });
    if (!pool.length) return;
    f.cur = pool[Math.floor(Math.random() * pool.length)];
    f.seen.push(f.cur);
    f.swaps++;
    loadFrame(f);
    updateSwapBtn(f);
  }

  function bindSwap(f) {
    var b = document.getElementById("swap");
    if (!b) return;
    updateSwapBtn(f);
    b.addEventListener("click", function() {
      swapFrame(f);
    });
  }

  function lock() {
    var b = document.getElementById("go");
    if (b) b.style.display = "none";
    var sw = document.getElementById("swap");
    if (sw) sw.style.display = "none";
    Array.prototype.forEach.call(document.querySelectorAll("#form input"), function(i) {
      i.readOnly = true;
    });
  }

  function nextBtn() {
    var last = idx === order.length - 1;
    document.getElementById("after").innerHTML =
      '<button type="button" id="next" class="w-full py-3.5 px-6 rounded-xl bg-k-elevated hover:bg-k-hover text-white font-semibold text-sm transition-all active:scale-[0.99]">' +
        (last ? "Итоги раунда" : "Следующий кадр →") +
      '</button>';
    var n = document.getElementById("next");
    n.focus();
    n.addEventListener("click", function() {
      idx++;
      show();
    });
  }

  function answerOf(f, k) {
    return k === "title" ? f.title : k === "dir" ? f.dir.join(", ") : k === "dop" ? f.dop.join(", ") : k === "country" ? f.country : f.year;
  }

  function submit(f) {
    if (f.done) return;
    f.done = true;
    var v = {};
    f.fields.forEach(function(x) { v[x[0]] = document.getElementById("i-" + x[0]).value; });
    var r = check(f, v), correctCount = 0;
    var fieldDetails = [];

    f.fields.forEach(function(x) {
      var key = x[0];
      var el = document.getElementById("f-" + key);
      var markEl = el.querySelector(".mark");
      var res = r[key];
      var good = !!res.good;
      var rawUserVal = String(v[key] || "").trim();
      var correctVal = answerOf(f, key);
      var isWarn = false;

      if (key === "dir" || key === "dop") {
        if (good && res.warn) {
          isWarn = true;
          el.classList.add("warn");
          markEl.textContent = "✓ Фамилия засчитана · Полное имя: " + res.matched;
        } else if (good) {
          el.classList.add("ok");
          markEl.textContent = "✓ Правильно";
        } else {
          el.classList.add("bad");
          markEl.textContent = "✗ Неправильно · " + correctVal;
        }
      } else if (key === "year") {
        if (res.exact) {
          el.classList.add("ok");
          markEl.textContent = "✓ Правильно";
        } else if (res.decade) {
          isWarn = true;
          el.classList.add("warn");
          markEl.textContent = "✓ Десятилетие засчитано · Точный год: " + f.year;
        } else {
          el.classList.add("bad");
          markEl.textContent = "✗ Неправильно · Правильный год: " + f.year;
        }
      } else {
        el.classList.add(good ? "ok" : "bad");
        markEl.textContent = good ? "✓ Правильно" : "✗ Неправильно · " + correctVal;
      }

      if (good) correctCount++;

      fieldDetails.push({
        key: key,
        label: x[1],
        good: good,
        warn: isWarn,
        userVal: rawUserVal,
        correctVal: (key === "dir" || key === "dop") && res.matched ? res.matched : correctVal
      });
    });

    log.push({
      title: f.title,
      year: f.year,
      swaps: f.swaps || 0,
      allCorrect: correctCount === f.fields.length,
      anyCorrect: correctCount > 0,
      fields: fieldDetails
    });

    var fill = document.getElementById("progress-fill");
    if (fill) fill.style.width = Math.round(((idx + 1) / order.length) * 100) + "%";

    var stateEl = document.getElementById("round-state");
    if (stateEl) {
      stateEl.innerHTML = correctCount === f.fields.length
        ? '<span class="text-k-mint font-medium">Всё верно</span>'
        : correctCount > 0
          ? '<span class="text-k-amber font-medium">Частично</span>'
          : '<span class="text-k-coral font-medium">Неверно</span>';
    }

    document.getElementById("status").innerHTML = correctCount === f.fields.length
      ? '<span class="text-k-mint">Все поля заполнены правильно</span>'
      : correctCount > 0
        ? 'Верных полей: <span class="text-white font-semibold">' + correctCount + '</span> из ' + f.fields.length
        : '<span class="text-k-coral">Ни одно поле не совпало</span>';

    lock();
    nextBtn();
  }

  /* ============================================================================
   * 8. ИТОГИ РАУНДА
   * ============================================================================ */
  function finish() {
    setHud(true);

    var items = log.map(function(entry, i) {
      var chips = entry.fields.map(function(fd) {
        if (fd.good && fd.warn) {
          return (
            '<span class="inline-flex flex-wrap items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] bg-k-amber/10 border border-k-amber/25 text-amber-200">' +
              '<span class="text-k-amber font-semibold">✓</span>' +
              '<span>' + esc(fd.label) + ':</span>' +
              '<strong class="font-medium text-white">' + esc(fd.correctVal) + '</strong>' +
            '</span>'
          );
        } else if (fd.good) {
          return (
            '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] bg-k-mint/10 border border-k-mint/25 text-teal-200">' +
              '<span class="text-k-mint font-semibold">✓</span>' +
              '<span>' + esc(fd.label) + '</span>' +
            '</span>'
          );
        } else {
          var userPart = fd.userVal
            ? '<span class="line-through opacity-60">' + esc(fd.userVal) + '</span> → '
            : '';
          return (
            '<span class="inline-flex flex-wrap items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] bg-k-coral/10 border border-k-coral/25 text-rose-200">' +
              '<span class="text-k-coral font-semibold">✗</span>' +
              '<span>' + esc(fd.label) + ':</span>' +
              '<span class="text-rose-100">' + userPart + '<strong class="font-medium text-white">' + esc(fd.correctVal) + '</strong></span>' +
            '</span>'
          );
        }
      }).join("");

      var statusDot = entry.allCorrect
        ? '<span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-k-mint shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-k-mint"></span>Правильно</span>'
        : entry.anyCorrect
          ? '<span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-k-amber shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-k-amber"></span>Частично</span>'
          : '<span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-k-coral shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-k-coral"></span>Неправильно</span>';

      return (
        '<li class="p-4 rounded-2xl bg-k-bg/80 border border-k-border flex flex-col gap-2.5">' +
          '<div class="flex items-start justify-between gap-3">' +
            '<div class="flex items-baseline gap-2.5 min-w-0">' +
              '<span class="text-xs text-k-muted shrink-0">' + (i + 1) + '.</span>' +
              '<div class="min-w-0">' +
                '<span class="text-sm text-white font-semibold">' + esc(entry.title) + '</span>' +
                '<span class="ml-1.5 text-xs text-k-muted">(' + esc(entry.year) + ')</span>' +
              '</div>' +
            '</div>' +
            statusDot +
          '</div>' +
          '<div class="flex flex-wrap gap-1.5">' +
            chips +
          '</div>' +
        '</li>'
      );
    }).join("");

    root.innerHTML =
      '<div class="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full py-4 animate-fade">' +
        '<div class="w-full rounded-3xl bg-k-surface border border-k-border p-6 sm:p-8">' +
          '<div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-5 mb-6 border-b border-k-border">' +
            '<div>' +
              '<div class="inline-flex items-center gap-2 mb-1">' +
                '<span class="w-1.5 h-1.5 rounded-full bg-k-mint"></span>' +
                '<span class="text-xs text-k-muted">Раунд завершён</span>' +
              '</div>' +
              '<h2 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Итоги сеанса</h2>' +
            '</div>' +
            '<span class="text-xs text-k-muted">' +
              'Разбор ответов по ' + order.length + ' ' + plural(order.length) +
            '</span>' +
          '</div>' +

          '<ul class="space-y-2.5 mb-7 max-h-[56dvh] overflow-y-auto custom-scroll pr-1">' +
            items +
          '</ul>' +

          '<div class="flex flex-col sm:flex-row gap-3">' +
            '<button type="button" id="again" class="flex-1 py-4 px-6 rounded-xl bg-k-mint hover:bg-k-mintHover text-[#13221E] font-bold text-sm tracking-wider uppercase transition-all active:scale-[0.99]">' +
              'Новые ' + Math.min(ROUND_SIZE, films.length) + ' фильмов' +
            '</button>' +
            '<button type="button" id="tomenu" class="flex-1 py-4 px-6 rounded-xl bg-k-elevated hover:bg-k-hover text-zinc-200 font-medium text-sm transition-all active:scale-[0.99]">' +
              'В главное меню' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    window.scrollTo({ top: 0, behavior: "smooth" });
    document.getElementById("again").addEventListener("click", function() {
      start();
    });
    document.getElementById("tomenu").addEventListener("click", function() {
      menu();
    });
  }

  /* ============================================================================
   * 9. ГЛОБАЛЬНЫЕ СОБЫТИЯ И ЗАПУСК
   * ============================================================================ */
  document.getElementById("brand-home").addEventListener("click", function() {
    menu();
  });

  refresh();
  </script>
</body>
</html>

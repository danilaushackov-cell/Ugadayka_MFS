  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: #09090B;
      color: #F4F4F5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.015) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.015) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite linear;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Состояния полей проверки */
    .field-group.ok input {
      border-color: rgba(34, 197, 94, 0.55) !important;
      background-color: rgba(34, 197, 94, 0.06) !important;
      color: #DCFCE7;
    }
    .field-group.ok .mark {
      color: #4ADE80;
    }

    .field-group.bad input {
      border-color: rgba(239, 68, 68, 0.55) !important;
      background-color: rgba(239, 68, 68, 0.06) !important;
      color: #FEE2E2;
    }
    .field-group.bad .mark {
      color: #F87171;
    }

    details summary::-webkit-details-marker {
      display: none;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 9999px;
    }

  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k) || "";
      localStorage.setItem(k, v);
    } catch (e) {}
    return "";
  }

  var sound = (function() {
    var ctx = null;
    var muted = store("kinokadr_muted") === "1";

    function ensureCtx() {
      if (!ctx) {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) ctx = new AudioCtx();
      }
      if (ctx && ctx.state === "suspended") ctx.resume();
    }

    function tone(freq, dur, type, delay, vol) {
      if (muted) return;
      try {
        ensureCtx();
        if (!ctx) return;
        var now = ctx.currentTime + (delay || 0);
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(vol || 0.045, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      } catch (e) {}
    }

    return {
      isMuted: function() { return muted; },
      toggle: function() {
        muted = !muted;
        store("kinokadr_muted", muted ? "1" : "0");
        if (!muted) tone(523.25, 0.12, "sine", 0, 0.035);
        return muted;
      },

        tone(523.25, 0.16, "sine", 0, 0.045);
        tone(659.25, 0.16, "sine", 0.08, 0.045);
        tone(783.99, 0.28, "sine", 0.16, 0.05);
      },
      partial: function() {

        tone(554.37, 0.22, "sine", 0.09, 0.04);
      },
      fail: function() {
        tone(311.13, 0.18, "triangle", 0, 0.04);
        tone(246.94, 0.28, "triangle", 0.11, 0.04);
      }
    };
  })();

  /* ============================================================================
   * 3. НЕЧЁТКОЕ СРАВНЕНИЕ ОТВЕТОВ (ЛЕВЕНШТЕЙН, СИНОНИМЫ, ДЕСЯТИЛЕТИЯ)
   * ============================================================================ */
  function norm(s) {
    return String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s]/g, "").replace(/\s+/g, " ").trim();
  }
  function lev(a, b) {
    var m = a.length, n = b.length, p = [], i, j, c;
    if (!m) return n;
    if (!n) return m;
    for (j = 0; j <= n; j++) p[j] = j;
    for (i = 1; i <= m; i++) {
      var prev = p[0];
      p[0] = i;
      for (j = 1; j <= n; j++) {
        var t = p[j];
        c = a[i - 1] === b[j - 1] ? 0 : 1;
        p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + c);
        prev = t;
      }
    }
    return p[n];
  }
  function near(inp, v) {
    var a = norm(inp), b = norm(v);
    if (!a || !b) return false;
    var tol = b.length <= 4 ? 0 : b.length <= 8 ? 1 : b.length <= 14 ? 2 : 3;
    return lev(a, b) <= tol;
  }
  function anyNear(inp, list) {
    return list.some(function(v) { return near(inp, v); });
  }
  function names(s) {
    return s.split(/,|\s+и\s+/).map(function(x) { return x.trim(); }).filter(Boolean);
  }
  function personVariants(list) {
    var out = [];
    list.forEach(function(n) {
      var p = n.split(" ");
      out.push(n);
      if (p.length > 1) {
        out.push(p[p.length - 1]);
        out.push(p[0] + " " + p[p.length - 1]);
      }
      if (p.length > 2) out.push(p.slice(-2).join(" "));
      (ALIAS[n] || []).forEach(function(x) { out.push(x); });
    });
    return out;
  }
  function titleVariants(t) {
    var base = t.replace(/\s*\([^)]*\)/g, "");
    var v = [t, base, base.split(",")[0]].concat(ALIAS[t] || []);
    base.split(/\s+или\s+/i).forEach(function(x) { v.push(x); });
    return v;
  }
  function countryVariants(c) {
    var v = [c];
    names(c).forEach(function(x) { v.push(x); });
    (CA[norm(c)] || []).forEach(function(x) { v.push(x); });
    return v;
  }
  function sameDecade(inp, year) {
    var y = (String(inp).match(/\d{4}/) || [""])[0];
    return !!y && Math.floor(+y / 10) === Math.floor(+year / 10);
  }
  function check(f, v) {
    var r = {
      title: anyNear(v.title, titleVariants(f.title)),
      dir: anyNear(v.dir, personVariants(f.dir)),
      year: sameDecade(v.year, f.year)
    };
    if (f.dop.length) r.dop = anyNear(v.dop, personVariants(f.dop));
    if (f.country) r.country = anyNear(v.country, countryVariants(f.country));
    return r;
  }
  function fieldsFor(f) {
    var a = [
      ["title", "Название фильма", ""],
      ["dir", "Режиссёр", "Имя или фамилия"]
    ];
    if (f.dop.length) a.push(["dop", "Оператор", f.dop.length > 1 ? "Любой из операторов" : "Имя или фамилия"]);
    if (f.country) a.push(["country", "Страна", ""]);
    a.push(["year", "Год выхода", "Точность до десятилетия"]);
    return a;
  }

  /* ============================================================================
   * 4. РАЗБОР ТАБЛИЦЫ И ЗАГРУЗКА ДАННЫХ (JSONP + GOOGLE DRIVE)
   * ============================================================================ */
  var FOLDER = /drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/g;
  var FILE = /drive\.google\.com\/(?:file\/d\/|(?:open|uc)\?(?:[^\s"]*&)?id=)([\w-]+)/g;
  var HDR = /\(([^()]*\d{4}[^()]*реж[^()]*)\)/gi;
  function makeFilm(pre, inner) {
    var y = inner.match(/\d{4}/);
    if (!y) return null;
    var rest = inner.slice(inner.indexOf(y[0]) + 4), ri = rest.search(/реж/i);
    if (ri < 0) return null;
    var country = rest.slice(0, ri).replace(/^\s*г\.?(?=[\s\-–—,.]|$)/, "").replace(/^[\s\-–—,.]+|[\s\-–—,.]+$/g, "");
    var rr = rest.slice(ri).replace(/^реж\.?/i, ""), oi = rr.search(/опер/i);
    var dirS = oi < 0 ? rr : rr.slice(0, oi), dopS = oi < 0 ? "" : rr.slice(oi).replace(/^опер\.?/i, "");
    var title = pre.replace(/^[\s"«“]+|[\s"»”,]+$/g, "").replace("докторо ", "доктора ");
    var dir = names(dirS);
    if (!title || !dir.length) return null;
    return { title: title, year: y[0], country: country, dir: dir, dop: names(dopS), folders: [], files: [], imgs: [] };
  }
  function parseRows(rows) {
    var out = [], cur = null;
    rows.forEach(function(cell) {
      String(cell).split(/\n/).forEach(function(line) {
        var m, last = null;
        HDR.lastIndex = 0;
        while ((m = HDR.exec(line))) last = m;
        if (last) {
          cur = makeFilm(line.slice(0, last.index), last[1]);
          if (cur) out.push(cur);
          return;
        }
        if (!cur) return;
        var u;
        FOLDER.lastIndex = 0;
        while ((u = FOLDER.exec(line))) cur.folders.push(u[1]);
        FILE.lastIndex = 0;
        while ((u = FILE.exec(line))) cur.files.push(u[1]);
      });
    });
    return out;
  }

  function parseUrl(u) {
    return { id: (u.match(/\/d\/([\w-]+)/) || [])[1], gid: (u.match(/[#&?]gid=(\d+)/) || [])[1] };
  }
  function loadSheet(id, gid) {
    return new Promise(function(res, rej) {
      var cb = "__sheet" + Date.now(), s = document.createElement("script"), t;
      function done() {
        clearTimeout(t);
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      t = setTimeout(function() { done(); rej(new Error("timeout")); }, 12000);
      window[cb] = function(r) { done(); res(r); };
      s.onerror = function() { done(); rej(new Error("load")); };
      s.onload = function() { setTimeout(function() { if (window[cb]) { done(); rej(new Error("format")); } }, 300); };
      s.src = "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=" + encodeURIComponent("out:json;responseHandler:" + cb) + "&headers=0" + (gid ? "&gid=" + gid : "") + "&_=" + Date.now();
      document.head.appendChild(s);
    });
  }
  function sheetCells(r) {
    var cells = [];
    if (!r || !r.table) return cells;
    (r.table.cols || []).forEach(function(c) { if (c && c.label) cells.push(c.label); });
    (r.table.rows || []).forEach(function(row) { (row.c || []).forEach(function(c) { if (c && c.v != null) cells.push(String(c.v)); }); });
    return cells;
  }

  function jsonp(url, timeout) {
    return new Promise(function(res, rej) {
      var cb = "__j" + Date.now() + Math.floor(Math.random() * 1e6), s = document.createElement("script"), t;
      function done() {
        clearTimeout(t);
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      t = setTimeout(function() { done(); rej(new Error("timeout")); }, timeout || 15000);
      window[cb] = function(r) { done(); res(r); };
      s.onerror = function() { done(); rej(new Error("load")); };
      s.src = url + (url.indexOf("?") < 0 ? "?" : "&") + "callback=" + cb;
      document.head.appendChild(s);
    });
  }
  function folderImages(fid, key, script) {
    var known = KNOWN[fid] || [];
    var viaScript = script ? jsonp(script + (script.indexOf("?") < 0 ? "?" : "&") + "folder=" + encodeURIComponent(fid))
      .then(function(r) { return (r && r.files) || []; }).catch(function() { return []; }) : Promise.resolve([]);
    return viaScript.then(function(a) {
      if (a.length) return a;
      if (!key) return known;
      var q = "'" + fid + "' in parents and mimeType contains 'image/' and trashed=false";
      return fetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=" + encodeURIComponent("files(id)") + "&pageSize=200&key=" + encodeURIComponent(key))
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(j) { var b = (j.files || []).map(function(x) { return x.id; }); return b.length ? b : known; })
        .catch(function() { return known; });
    });
  }
  function resolveFilm(f, key, script) {
    return Promise.all(f.folders.map(function(id) { return folderImages(id, key, script); })).then(function(lists) {
      var seen = {};
      f.imgs = [].concat.apply(f.files.slice(), lists).filter(function(x) { if (seen[x]) return false; seen[x] = 1; return true; });
      return f;
    });
  }
  function imgSrc(id, alt) {
    return alt ? "https://lh3.googleusercontent.com/d/" + id + "=w1600" : "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
  }

  /* ============================================================================
   * 5. СОСТОЯНИЕ ИГРЫ И ВЫБОРКА 10 СЛУЧАЙНЫХ ФИЛЬМОВ
   * ============================================================================ */
  var root = document.getElementById("game"),

      films = [],

  function setHud(visible) {
    if (!appHeader) return;
    if (visible) {
      appHeader.classList.remove("hidden");
      appHeader.classList.add("flex");
    } else {
      appHeader.classList.add("hidden");
      appHeader.classList.remove("flex");
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function pickTenFilms(pool) {
    var count = Math.min(ROUND_SIZE, pool.length);
    if (pool.length <= count) return shuffle(pool);

    var fresh = pool.filter(function(f) { return lastRoundTitles.indexOf(f.title) === -1; });
    var used = pool.filter(function(f) { return lastRoundTitles.indexOf(f.title) !== -1; });

    var selected = shuffle(fresh).slice(0, count);
    if (selected.length < count) {

  function plural(n) {

      .then(function(list) {

        films = list.filter(function(f) {

  /* ============================================================================

  function start() {

              '</span>' +
              '<span id="round-state" class="text-obsidian-muted">' +
                'Проверка ответа' +
              '</span>' +
            '</div>' +

            '<div class="w-full h-1 bg-obsidian-elevated rounded-full overflow-hidden mb-5">' +
              '<div id="progress-fill" class="h-full bg-white rounded-full transition-all duration-300" style="width:' + pct + '%"></div>' +
            '</div>' +

            '<form id="form" novalidate class="space-y-2.5">' +
              fieldsHtml +
              '<div class="pt-2">' +
                '<button type="submit" id="go" class="w-full py-3 px-5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-semibold text-sm transition-all active:scale-[0.99]">' +
                  'Проверить' +
                '</button>' +
              '</div>' +
            '</form>' +
          '</div>' +

          '<div class="mt-4">' +
            '<p id="status" role="status" class="text-center text-xs sm:text-[13px] font-medium text-zinc-300 min-h-[20px]"></p>' +
            '<div id="after" class="mt-2.5"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    loadFrame(f);
    bindSwap(f);

    var firstInput = document.getElementById("i-" + f.fields[0][0]);
    if (firstInput && window.innerWidth >= 1024) firstInput.focus();

    window.scrollTo({ top: 0, behavior: "smooth" });
    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();
      submit(f);
    });
  }

  /* ---- Кадр: загрузка и замена (до MAX_SWAPS раз на фильм) ---- */
  var MAX_SWAPS = 2;

  function loadFrame(f) {
    var shot = document.getElementById("shot");
    if (!shot) return;
    shot.innerHTML =
      '<div id="shot-skeleton" class="absolute inset-0 skeleton-shimmer flex items-center justify-center">' +
        '<span class="text-[11px] text-zinc-600 tracking-widest uppercase">Загрузка кадра</span>' +
      '</div>' +
      '<img id="frameimg" src="' + imgSrc(f.cur, 0) + '" alt="Кадр из фильма" referrerpolicy="no-referrer" ' +
        'class="relative z-10 w-full h-full object-contain opacity-0 transition-opacity duration-300">';

    var im = document.getElementById("frameimg"),
        skel = document.getElementById("shot-skeleton"),
        tried = 0;

    im.onload = function() {
      im.classList.remove("opacity-0");
      if (skel) skel.style.display = "none";
    };

    im.onerror = function() {
      if (!tried) {
        tried = 1;
        im.src = imgSrc(f.cur, 1);
      } else {
        shot.innerHTML =
          '<div class="p-6 text-center text-xs text-obsidian-muted max-w-xs">' +
            'Не удалось загрузить кадр. Проверьте интернет или доступ к Google Drive.' +
          '</div>';
      }
    };
  }

  function swapsLeft(f) {
    var unseen = f.imgs.length - f.seen.length;
    return Math.max(0, Math.min(MAX_SWAPS - f.swaps, unseen));
  }

  function updateSwapBtn(f) {
    var b = document.getElementById("swap");
    if (!b) return;
    if (f.imgs.length < 2) {
      b.style.display = "none";
      return;
    }
    var left = swapsLeft(f);
    b.disabled = left === 0;
    b.textContent = left > 0
      ? "↻ Другой кадр · осталось " + left
      : "Замен больше нет";
  }

  function swapFrame(f) {
    if (f.done || swapsLeft(f) === 0) return;
    var pool = f.imgs.filter(function(id) { return f.seen.indexOf(id) === -1; });
    if (!pool.length) return;
    f.cur = pool[Math.floor(Math.random() * pool.length)];
    f.seen.push(f.cur);
    f.swaps++;
    loadFrame(f);
    updateSwapBtn(f);
  }

  function bindSwap(f) {
    var b = document.getElementById("swap");
    if (!b) return;
    updateSwapBtn(f);
    b.addEventListener("click", function() {
      sound.click();
      swapFrame(f);
    });
  }

  function lock() {
    var b = document.getElementById("go");
    if (b) b.style.display = "none";
    var sw = document.getElementById("swap");
    if (sw) sw.style.display = "none";
    Array.prototype.forEach.call(document.querySelectorAll("#form input"), function(i) {
      i.readOnly = true;
    });
  }

  function nextBtn() {
    var last = idx === order.length - 1;
    document.getElementById("after").innerHTML =
      '<button type="button" id="next" class="w-full py-3 px-5 rounded-xl bg-obsidian-elevated hover:bg-zinc-800 border border-obsidian-border text-white font-medium text-sm transition-all active:scale-[0.99]">' +
        (last ? "Итоги раунда" : "Следующий кадр →") +
      '</button>';
    var n = document.getElementById("next");
    n.focus();
    n.addEventListener("click", function() {
      sound.click();
      idx++;
      show();
    });
  }

  function answerOf(f, k) {
    return k === "title" ? f.title : k === "dir" ? f.dir.join(", ") : k === "dop" ? f.dop.join(", ") : k === "country" ? f.country : f.year;
  }

  function submit(f) {
    if (f.done) return;
    f.done = true;
    var v = {};
    f.fields.forEach(function(x) { v[x[0]] = document.getElementById("i-" + x[0]).value; });
    var r = check(f, v), correctCount = 0;
    var fieldDetails = [];

    f.fields.forEach(function(x) {
      var el = document.getElementById("f-" + x[0]), good = r[x[0]];
      var rawUserVal = String(v[x[0]] || "").trim();
      var correctVal = answerOf(f, x[0]);
      el.classList.add(good ? "ok" : "bad");
      var exact = x[0] === "year" && (String(v.year).match(/\d{4}/) || [""])[0] !== f.year;
      if (good) {
        correctCount++;
        el.querySelector(".mark").textContent = exact
          ? "✓ Правильно (точный год: " + f.year + ")"
          : "✓ Правильно";
      } else {
        el.querySelector(".mark").textContent = "✗ Неправильно · " + correctVal;
      }

      fieldDetails.push({
        key: x[0],
        label: x[1],
        good: !!good,
        userVal: rawUserVal,
        correctVal: correctVal
      });
    });

    if (correctCount === f.fields.length) {
      sound.perfect();
    } else if (correctCount > 0) {
      sound.partial();
    } else {
      sound.fail();
    }

    log.push({
      title: f.title,
      year: f.year,
      swaps: f.swaps || 0,
      allCorrect: correctCount === f.fields.length,
      anyCorrect: correctCount > 0,
      fields: fieldDetails
    });

    var fill = document.getElementById("progress-fill");
    if (fill) fill.style.width = Math.round(((idx + 1) / order.length) * 100) + "%";

    var stateEl = document.getElementById("round-state");
    if (stateEl) {
      stateEl.innerHTML = correctCount === f.fields.length
        ? '<span class="text-emerald-400 font-medium">Всё верно</span>'
        : correctCount > 0
          ? '<span class="text-zinc-200 font-medium">Частично верно</span>'
          : '<span class="text-red-400 font-medium">Неверно</span>';
    }

    document.getElementById("status").innerHTML = correctCount === f.fields.length
      ? '<span class="text-emerald-400">Все поля заполнены правильно</span>'
      : correctCount > 0
        ? 'Верных полей: <span class="text-white font-semibold">' + correctCount + '</span> из ' + f.fields.length
        : '<span class="text-red-400">Ни одно поле не совпало</span>';

    lock();
    nextBtn();
  }

  /* ============================================================================
   * 8. ИТОГИ РАУНДА (БЕЗ БАЛЛОВ И ПРОЦЕНТОВ, ТОЛЬКО СТАТУСЫ ПОЛЕЙ)
   * ============================================================================ */
  function finish() {
    setHud(true);

    var items = log.map(function(entry, i) {
      var chips = entry.fields.map(function(fd) {
        if (fd.good) {
          return (
            '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] bg-emerald-500/10 border border-emerald-500/25 text-emerald-300">' +
              '<span class="text-emerald-400 font-semibold">✓</span>' +
              '<span>' + esc(fd.label) + '</span>' +
            '</span>'
          );
        } else {
          var userPart = fd.userVal
            ? '<span class="line-through opacity-60">' + esc(fd.userVal) + '</span> → '
            : '';
          return (
            '<span class="inline-flex flex-wrap items-center gap-1 px-2.5 py-1 rounded-md text-[11px] bg-red-500/10 border border-red-500/25 text-red-300">' +
              '<span class="text-red-400 font-semibold">✗</span>' +
              '<span>' + esc(fd.label) + ':</span>' +
              '<span class="text-red-200/85">' + userPart + '<strong class="font-medium text-white">' + esc(fd.correctVal) + '</strong></span>' +
            '</span>'
          );
        }
      }).join("");

      var statusBadge = entry.allCorrect
        ? '<span class="font-medium text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/25 text-emerald-300 shrink-0">Правильно</span>'
        : entry.anyCorrect
          ? '<span class="font-medium text-[11px] px-2.5 py-0.5 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-300 shrink-0">Частично</span>'
          : '<span class="font-medium text-[11px] px-2.5 py-0.5 rounded-full bg-red-500/15 border border-red-500/25 text-red-300 shrink-0">Неправильно</span>';

      return (
        '<li class="p-4 rounded-xl bg-obsidian-bg/70 border border-obsidian-border flex flex-col gap-2.5">' +
          '<div class="flex items-start justify-between gap-3">' +
            '<div class="flex items-baseline gap-2 min-w-0">' +
              '<span class="font-mono text-xs text-obsidian-muted shrink-0">' + (i + 1) + '.</span>' +
              '<div class="min-w-0">' +
                '<span class="text-sm text-white font-semibold">' + esc(entry.title) + '</span>' +
                '<span class="ml-1.5 text-xs text-obsidian-muted">(' + esc(entry.year) + ')</span>' +
              '</div>' +
            '</div>' +
            statusBadge +
          '</div>' +
          '<div class="flex flex-wrap gap-1.5">' +
            chips +
          '</div>' +
        '</li>'
      );
    }).join("");

    root.innerHTML =
      '<div class="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full py-4 animate-fade">' +
        '<div class="w-full rounded-2xl bg-obsidian-surface border border-obsidian-border p-5 sm:p-7">' +
          '<div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-5 mb-6 border-b border-obsidian-border">' +
            '<div>' +
              '<p class="text-[11px] uppercase tracking-[0.2em] text-obsidian-muted mb-1">Раунд завершён</p>' +
              '<h2 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Итоги сеанса</h2>' +
            '</div>' +
            '<span class="text-xs text-obsidian-muted">' +
              'Разбор ответов по ' + order.length + ' ' + plural(order.length) +
            '</span>' +
          '</div>' +

          '<ul class="space-y-2.5 mb-6 max-h-[56dvh] overflow-y-auto custom-scroll pr-1">' +
            items +
          '</ul>' +

          '<div class="flex flex-col sm:flex-row gap-3">' +
            '<button type="button" id="again" class="flex-1 py-3 px-5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-semibold text-sm transition-all active:scale-[0.99]">' +
              'Новые ' + Math.min(ROUND_SIZE, films.length) + ' фильмов' +
            '</button>' +
            '<button type="button" id="tomenu" class="flex-1 py-3 px-5 rounded-xl bg-obsidian-elevated hover:bg-zinc-800 border border-obsidian-border text-zinc-200 font-medium text-sm transition-all active:scale-[0.99]">' +
              'В главное меню' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    window.scrollTo({ top: 0, behavior: "smooth" });
    document.getElementById("again").addEventListener("click", function() {
      sound.click();
      start();
    });
    document.getElementById("tomenu").addEventListener("click", function() {
      sound.click();
      menu();
    });
  }

  /* ============================================================================
   * 9. ГЛОБАЛЬНЫЕ СОБЫТИЯ И ЗАПУСК
   * ============================================================================ */
  function syncSoundIcon() {
    var on = document.getElementById("sound-icon-on");
    var off = document.getElementById("sound-icon-off");
    if (!on || !off) return;
    if (sound.isMuted()) {
      on.classList.add("hidden");
      off.classList.remove("hidden");
    } else {
      on.classList.remove("hidden");
      off.classList.add("hidden");
    }
  }

  document.getElementById("sound-toggle").addEventListener("click", function() {
    sound.toggle();
    syncSoundIcon();
  });

  document.getElementById("brand-home").addEventListener("click", function() {
    sound.click();
    menu();
  });

  syncSoundIcon();
  refresh();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }
  </script>
</body>
